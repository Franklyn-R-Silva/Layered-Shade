# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# One grouped PR per ecosystem per month, and security fixes grouped into one PR,
# so the repo never piles up a branch per package.

version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 2
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-all:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps):'
    labels:
      - 'dependencies'
      - 'automated'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    groups:
      actions-all:
        patterns: ['*']
    commit-message:
      prefix: 'chore(actions):'
    labels:
      - 'github-actions'
      - 'automated'
