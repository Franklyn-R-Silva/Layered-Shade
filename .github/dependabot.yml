# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# One grouped PR per ecosystem per month, and security fixes grouped into one PR,
# so the repo never piles up a branch per package. New releases wait 7 days (cooldown)
# before Dependabot proposes them, so a bad or malicious publish is usually pulled first.

version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    ignore:
      # typescript-eslint (peer typescript <6.1) does not support TypeScript 7 yet; drop this when it does.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-all:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps):'
    labels:
      - 'dependencies'
      - 'automated'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    groups:
      actions-all:
        patterns: ['*']
    commit-message:
      prefix: 'chore(actions):'
    labels:
      - 'github-actions'
      - 'automated'
